<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bergium × Webamp - Demo</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; min-height: 100%;
        background: #000; color: #fff;
        font-family: system-ui, sans-serif;
      }
      /* Webamp mounts its windows centered in this container. */
      #webamp { position: relative; height: 100vh; background: #000; }
      .hint {
        position: fixed; left: 16px; bottom: 16px; z-index: 1;
        font-size: 12px; color: rgba(255,255,255,0.55);
        background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px;
        backdrop-filter: blur(8px);
      }
    </style>
  </head>
  <body>
    <div id="webamp"></div>
    <p class="hint">Click the visualizer window to toggle Geiss / Milkdrop.</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
